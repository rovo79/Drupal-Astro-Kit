name: 'DAK: Decoupled base'
description: 'Baseline modules for a decoupled Drupal instance serving JSON:API for Astro SSG.'
type: 'Site'

install:
  - jsonapi
  - menu_link_content
  - path
  - pathauto

config:
  import:
    pathauto:
      - pathauto.pattern.page
  actions:
    system.feature_flags:
      simpleConfigUpdate:
        linkset_endpoint: true
    system.site:
      simpleConfigUpdate:
        page.front: /home
