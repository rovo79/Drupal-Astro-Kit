langcode: en
status: true
dependencies:
  config:
    - field.field.node.collection.field_collection_image
    - field.field.node.collection.field_collection_type
    - field.field.node.collection.field_external_key
    - field.field.node.collection.field_featured
    - field.field.node.collection.field_featured_products
    - field.field.node.collection.field_promote_to_home
    - field.field.node.collection.field_sort_weight
    - field.field.node.collection.field_summary
    - node.type.collection
  module:
    - field_group
    - media_library
    - options
    - path
    - text
third_party_settings:
  field_group:
    group_collection_tabs:
      children:
        - group_collection_core
        - group_collection_curation
        - group_collection_publishing
      label: 'Collection Editing'
      region: content
      parent_name: ''
      weight: 0
      format_type: tabs
      format_settings:
        classes: ''
        show_empty_fields: false
        id: group_collection_tabs
        direction: vertical
        width_breakpoint: 640
    group_collection_core:
      children:
        - title
        - field_external_key
        - field_summary
        - field_collection_type
        - field_collection_image
      label: Core
      region: content
      parent_name: group_collection_tabs
      weight: 1
      format_type: tab
      format_settings:
        classes: ''
        show_empty_fields: false
        id: group_collection_core
        formatter: open
        description: 'Core fields define the main Collection record Astro reads: title, stable identity key, summary, collection type, and the lead image for collection cards and detail pages.'
        required_fields: true
    group_collection_curation:
      children:
        - field_featured_products
        - field_featured
        - field_promote_to_home
        - field_sort_weight
      label: Curation
      region: content
      parent_name: group_collection_tabs
      weight: 2
      format_type: tab
      format_settings:
        classes: ''
        show_empty_fields: false
        id: group_collection_curation
        formatter: closed
        description: 'Curation fields determine which Products belong in this editorial grouping and whether Astro promotes the Collection more prominently or onto the homepage.'
        required_fields: true
    group_collection_publishing:
      children:
        - path
        - status
        - uid
        - created
      label: Publishing
      region: content
      parent_name: group_collection_tabs
      weight: 3
      format_type: tab
      format_settings:
        classes: ''
        show_empty_fields: false
        id: group_collection_publishing
        formatter: closed
        description: 'Publishing fields affect path alias, author, created date, and published state in Drupal. Astro only reads published Collections at build time.'
        required_fields: true
id: node.collection.default
targetEntityType: node
bundle: collection
mode: default
content:
  title:
    type: string_textfield
    weight: 0
    region: content
    settings:
      size: 60
      placeholder: ''
    third_party_settings: {}
  field_external_key:
    type: string_textfield
    weight: 1
    region: content
    settings:
      size: 60
      placeholder: ''
    third_party_settings: {}
  field_summary:
    type: text_textarea
    weight: 2
    region: content
    settings:
      rows: 5
      placeholder: ''
    third_party_settings: {}
  field_collection_type:
    type: options_select
    weight: 3
    region: content
    settings: {}
    third_party_settings: {}
  field_collection_image:
    type: media_library_widget
    weight: 4
    region: content
    settings: {}
    third_party_settings: {}
  field_featured_products:
    type: entity_reference_autocomplete
    weight: 10
    region: content
    settings:
      match_operator: CONTAINS
      match_limit: 10
      size: 60
      placeholder: ''
    third_party_settings: {}
  field_featured:
    type: boolean_checkbox
    weight: 11
    region: content
    settings:
      display_label: true
    third_party_settings: {}
  field_promote_to_home:
    type: boolean_checkbox
    weight: 12
    region: content
    settings:
      display_label: true
    third_party_settings: {}
  field_sort_weight:
    type: number
    weight: 13
    region: content
    settings:
      placeholder: ''
      min: null
      max: null
      prefix: ''
      suffix: ''
    third_party_settings: {}
  path:
    type: path
    weight: 20
    region: content
    settings: {}
    third_party_settings: {}
  status:
    type: boolean_checkbox
    weight: 21
    region: content
    settings:
      display_label: true
    third_party_settings: {}
  uid:
    type: entity_reference_autocomplete
    weight: 22
    region: content
    settings:
      match_operator: CONTAINS
      match_limit: 10
      size: 60
      placeholder: ''
    third_party_settings: {}
  created:
    type: datetime_timestamp
    weight: 23
    region: content
    settings: {}
    third_party_settings: {}
hidden:
  promote: true
  sticky: true
